<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inky Web</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>Inky Web</h1>
  <span id="busy" class="badge" data-i18n="header.busy" hidden></span>
  <span id="paused" class="badge paused" data-i18n="header.paused" hidden></span>
  <div class="lang-switch" role="group" data-i18n-title="lang.title">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <section class="card" id="status-card">
    <h2 data-i18n="status.title"></h2>
    <div class="status-grid">
      <div>
        <div id="preview-box" class="preview-box"><img id="preview" data-i18n-alt="status.previewAlt"></div>
        <div class="row preview-tools">
          <button type="button" id="rot-left" data-i18n-title="status.rotLeft">⟲</button>
          <button type="button" id="rot-right" data-i18n-title="status.rotRight">⟳</button>
          <button type="button" id="rot-reset" data-i18n-title="status.rotReset">Auto</button>
          <small data-i18n="status.rotHint"></small>
        </div>
      </div>
      <dl>
        <dt data-i18n="status.mode"></dt><dd id="st-mode">—</dd>
        <dt data-i18n="status.showing"></dt><dd id="st-detail">—</dd>
        <dt data-i18n="status.last"></dt><dd id="st-last">—</dd>
        <dt data-i18n="status.next"></dt><dd id="st-next">—</dd>
        <dt data-i18n="status.resolution"></dt><dd id="st-res">—</dd>
      </dl>
    </div>
    <p id="st-error" class="error" hidden></p>
    <div class="row">
      <button id="btn-refresh" class="primary" data-i18n="status.refresh"></button>
      <button type="button" id="btn-pause"></button>
      <button type="button" id="btn-save-current" hidden></button>
      <a id="btn-download" class="button" data-i18n="status.download" hidden download></a>
      <small id="current-msg"></small>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="mode.title"></h2>
    <div class="segmented" id="mode">
      <label><input type="radio" name="mode" value="single"> <span data-i18n="mode.single"></span></label>
      <label><input type="radio" name="mode" value="gallery"> <span data-i18n="mode.gallery"></span></label>
      <label><input type="radio" name="mode" value="comics"> <span data-i18n="mode.comics"></span></label>
      <label><input type="radio" name="mode" value="newspapers"> <span data-i18n="mode.newspapers"></span></label>
    </div>
    <label class="row">
      <span data-i18n="mode.every"></span>
      <input type="number" id="interval" min="2" step="1"> <span data-i18n="mode.minutes"></span>
      <small id="interval-hint"></small>
    </label>
    <p class="hint" data-i18n="mode.hint"></p>
    <label class="row">
      <input type="checkbox" id="refresh-on-start"> <span data-i18n="mode.refreshOnStart"></span>
      <small data-i18n="mode.refreshOnStartHint"></small>
    </label>
    <div class="row">
      <button type="button" id="mode-apply" class="primary" data-i18n="common.apply" disabled></button>
      <button type="button" id="mode-discard" data-i18n="common.discard" disabled></button>
      <small id="mode-pending" class="pending" data-i18n="common.pending" hidden></small>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="images.title"></h2>
    <form id="upload-form" class="row">
      <label class="button">
        <input type="file" id="files" name="files" accept="image/*" multiple hidden>
        <span data-i18n="images.choose"></span>
      </label>
      <small id="files-chosen"></small>
      <span data-i18n="images.uploadTo"></span>
      <select id="upload-target"></select>
      <button type="submit" data-i18n="images.upload"></button>
      <span id="upload-msg" class="hint"></span>
    </form>

    <h3 data-i18n="col.title"></h3>
    <p class="hint" data-i18n="col.hint"></p>
    <ul id="collections" class="searches"></ul>
    <form id="collection-form" class="row">
      <input type="text" id="collection-name" maxlength="40" data-i18n-placeholder="col.namePlaceholder">
      <button type="submit" data-i18n="col.create"></button>
      <small id="collection-msg" class="error"></small>
    </form>
    <label class="row">
      <span data-i18n="images.order"></span>
      <select id="gallery-order">
        <option value="random" data-i18n="images.random"></option>
        <option value="sequential" data-i18n="images.sequential"></option>
      </select>
      <small data-i18n="images.orderHint"></small>
    </label>

    <h3 data-i18n="images.library"></h3>
    <div class="row">
      <span data-i18n="images.view"></span>
      <select id="view-filter"></select>
      <input type="text" id="name-filter" data-i18n-placeholder="images.namePlaceholder">
      <small id="view-count"></small>
    </div>
    <div class="row">
      <button type="button" id="select-all" data-i18n="images.selectAll"></button>
      <button type="button" id="select-none" data-i18n="images.selectNone" disabled></button>
      <small data-i18n="images.selectHint"></small>
    </div>
    <div class="row">
      <select id="bulk-target"></select>
      <button type="button" id="bulk-add" data-i18n="images.addTo" disabled></button>
      <button type="button" id="bulk-remove" hidden disabled></button>
      <button type="button" id="delete-selected" class="danger" disabled></button>
      <small id="selection-msg"></small>
    </div>
    <div id="images" class="grid"></div>
    <p id="images-empty" class="hint" hidden></p>
  </section>

  <section class="card">
    <h2 data-i18n="comics.title"></h2>
    <label class="row">
      <span data-i18n="comics.apiKey"></span>
      <input type="password" id="api-key" autocomplete="off">
      <button type="button" id="save-key" data-i18n="comics.save"></button>
    </label>
    <label class="row">
      <input type="checkbox" id="random-volume"> <span data-i18n="comics.randomVolume"></span>
    </label>
    <div class="row">
      <span data-i18n="comics.budget"></span>
      <input type="number" id="rate-limit" min="10" max="200" step="10">
      <small id="api-usage"></small>
    </div>
    <h3 data-i18n="comics.searches"></h3>
    <p class="hint" data-i18n="comics.searchesHint"></p>
    <ul id="searches" class="searches"></ul>
    <form id="query-form" class="row">
      <input type="text" id="query-input" data-i18n-placeholder="comics.queryPlaceholder">
      <button type="submit" data-i18n="comics.add"></button>
    </form>
  </section>

  <section class="card">
    <h2 data-i18n="news.title"></h2>
    <p class="hint" data-i18n="news.hint"></p>
    <p id="news-nopdf" class="hint" data-i18n="news.noPdf" hidden></p>
    <ul id="newspapers" class="searches"></ul>
    <p id="news-empty" class="hint" data-i18n="news.empty" hidden></p>
    <div id="news-probe" class="probe-out" hidden></div>
    <h3 data-i18n="news.addTitle"></h3>
    <form id="news-form" class="row">
      <select id="news-source"></select>
      <select id="news-country"></select>
      <select id="news-paper"></select>
      <button type="submit" id="news-add" data-i18n="comics.add" disabled></button>
      <button type="button" id="news-reload" data-i18n="news.reload" data-i18n-title="news.reloadTitle"></button>
    </form>
    <small id="news-msg"></small>
  </section>

  <template id="search-panel-tpl">
    <div class="search-panel">
      <label class="row"><input type="checkbox" name="advanced"> <strong data-i18n="adv.enable"></strong></label>
      <label class="row"><span data-i18n="adv.name"></span>
        <input type="text" name="name" maxlength="60" data-i18n-placeholder="adv.namePlaceholder">
      </label>
      <label class="row"><span data-i18n="adv.term"></span> <input type="text" name="term"></label>
      <div class="adv-fields">
        <fieldset>
          <legend data-i18n="adv.cvGroup"></legend>
          <label class="row"><span data-i18n="adv.source"></span>
            <select name="source">
              <option value="search" data-i18n="adv.sourceSearch"></option>
              <option value="volumes" data-i18n="adv.sourceVolumes"></option>
              <option value="issues" data-i18n="adv.sourceIssues"></option>
            </select>
          </label>
          <label class="row cv-only"><span data-i18n="adv.cvFilter"></span>
            <input type="text" name="cv_filter" placeholder="date_added:2020-01-01|2026-12-31">
          </label>
          <label class="row cv-only"><span data-i18n="adv.sort"></span>
            <input type="text" name="sort" placeholder="name:asc">
          </label>
          <div class="row">
            <span data-i18n="adv.pages"></span> <input type="number" name="pages" min="1">
            × <input type="number" name="page_size" min="1">
            <small class="cost"></small>
          </div>
          <label class="row"><span data-i18n="adv.volumeId"></span>
            <input type="number" name="volume_id" min="1" placeholder="4250">
            <small class="volume-id-hint"></small>
          </label>
          <small class="hint fields-hint"></small>
        </fieldset>
        <fieldset>
          <legend data-i18n="adv.appGroup"></legend>
          <label class="row vol-only"><span data-i18n="adv.publishers"></span>
            <input type="text" name="publishers" data-i18n-placeholder="adv.publishersPlaceholder">
          </label>
          <div class="row vol-only">
            <span data-i18n="adv.years"></span>
            <input type="number" name="year_from" min="1800" max="2200"> –
            <input type="number" name="year_to" min="1800" max="2200">
          </div>
          <label class="row vol-only"><span data-i18n="adv.minIssues"></span> <input type="number" name="min_issues" min="1"></label>
          <label class="row"><span data-i18n="adv.exclude"></span>
            <input type="text" name="exclude_words" data-i18n-placeholder="adv.excludePlaceholder">
          </label>
          <small class="hint issues-only" data-i18n="adv.issuesFiltersHint"></small>
          <label class="jq-row"><span data-i18n="adv.jq"></span>
            <textarea name="jq" rows="2" spellcheck="false" placeholder="map(select(.count_of_issues > 50))"></textarea>
          </label>
          <small class="hint jq-hint"></small>
        </fieldset>
        <fieldset>
          <legend data-i18n="adv.pickGroup"></legend>
          <label class="row"><span class="volume-pick-label"></span>
            <select name="volume_pick">
              <option value="random" data-i18n="adv.pickRandom"></option>
              <option value="first" data-i18n="adv.pickFirst"></option>
              <option value="sequential" class="issues-only" data-i18n="adv.pickSequential"></option>
            </select>
          </label>
          <label class="row vol-only"><span data-i18n="adv.issuePick"></span>
            <select name="issue_pick">
              <option value="random_all" data-i18n="adv.issueRandomAll"></option>
              <option value="first100" data-i18n="adv.issueFirst100"></option>
              <option value="sequential" data-i18n="adv.issueSequential"></option>
            </select>
          </label>
          <div class="row seq-row">
            <small class="seq-info"></small>
            <button type="button" data-act="reset-seq" data-i18n="adv.seqReset"></button>
          </div>
          <div class="row">
            <span data-i18n="adv.coverDates"></span>
            <input type="date" name="cover_date_from"> – <input type="date" name="cover_date_to">
            <small class="issues-only" data-i18n="adv.coverDatesIssuesHint"></small>
          </div>
          <label class="row"><span data-i18n="adv.cacheHours"></span> <input type="number" name="cache_hours" min="1" max="168"></label>
        </fieldset>
      </div>
      <div class="row">
        <button type="button" class="primary" data-act="save" data-i18n="adv.save"></button>
        <button type="button" data-act="cancel" data-i18n="adv.cancel"></button>
        <button type="button" data-act="probe" class="adv-only" data-i18n="adv.probe"></button>
        <button type="button" data-act="clear-cache" class="adv-only" data-i18n="adv.clearCache"></button>
        <small class="panel-msg"></small>
      </div>
      <div class="probe-out" hidden></div>
    </div>
  </template>

  <section class="card">
    <h2 data-i18n="buttons.title"></h2>
    <p class="hint" data-i18n="buttons.hint"></p>
    <div id="buttons" class="buttons"></div>
    <p id="buttons-unavailable" class="hint" data-i18n="buttons.unavailable" hidden></p>
    <small id="buttons-msg"></small>
  </section>

  <section class="card">
    <h2 data-i18n="display.title"></h2>
    <label class="row">
      <span data-i18n="display.fit"></span>
      <select id="fit">
        <option value="contain" data-i18n="display.contain"></option>
        <option value="fit" data-i18n="display.fill"></option>
      </select>
    </label>
    <label class="row">
      <span data-i18n="display.border"></span>
      <select id="border">
        <option value="white" data-i18n="display.white"></option>
        <option value="black" data-i18n="display.black"></option>
      </select>
    </label>
    <label class="row"><input type="checkbox" id="auto-rotate"> <span data-i18n="display.autoRotate"></span></label>
    <div class="sliders">
      <label><span data-i18n="display.color"></span> <input type="range" id="color" min="0" max="3" step="0.1"><output></output></label>
      <label><span data-i18n="display.contrast"></span> <input type="range" id="contrast" min="0" max="3" step="0.1"><output></output></label>
      <label><span data-i18n="display.brightness"></span> <input type="range" id="brightness" min="0" max="3" step="0.05"><output></output></label>
      <label><span data-i18n="display.saturation"></span> <input type="range" id="saturation" min="0" max="1" step="0.05"><output></output></label>
    </div>
    <p class="hint" data-i18n="display.hint"></p>
    <div class="row">
      <button type="button" id="display-apply" class="primary" data-i18n="common.apply" disabled></button>
      <button type="button" id="display-discard" data-i18n="common.discard" disabled></button>
      <button type="button" id="display-defaults" data-i18n="display.defaults" data-i18n-title="display.defaultsTitle"></button>
      <small id="display-pending" class="pending" data-i18n="common.pending" hidden></small>
    </div>

    <h3 data-i18n="presets.title"></h3>
    <p class="hint" data-i18n="presets.hint"></p>
    <ul id="presets" class="presets"></ul>
    <p id="presets-empty" class="hint" data-i18n="presets.empty" hidden></p>
    <form id="preset-form" class="row">
      <input type="text" id="preset-name" maxlength="40" data-i18n-placeholder="presets.namePlaceholder">
      <button type="submit" data-i18n="presets.save"></button>
      <small id="preset-msg"></small>
    </form>
  </section>
</main>

<script src="{{ url_for('static', filename='i18n.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
